# Fallback configuration if Railway service is built using Nixpacks instead of Dockerfile
providers = ["...", "python"]

[phases.setup]
nixPkgs = ["nodejs_22", "python311", "ffmpeg", "libsndfile"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir --upgrade pip",
  "/opt/venv/bin/pip install --no-cache-dir -r backend/requirements.txt",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "/opt/venv/bin/python backend/run_inference.py --warmup"
]

[variables]
PYTHON_PATH = "/opt/venv/bin/python3"
NODE_ENV = "production"

[start]
cmd = "npm start"
